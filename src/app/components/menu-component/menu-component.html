@if (isAuthenticated()) {
  <nav class="app-navbar">
    <div class="navbar-inner">
      <a class="navbar-brand app-brand" [routerLink]="'/perfil'">
        <span class="brand-icon" aria-hidden="true">E</span>
        <span>Empleados</span>
      </a>
      <div class="navbar-nav app-nav">
        <a
          class="nav-link"
          [routerLink]="'/perfil'"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          >Mi perfil</a
        >
        <a class="nav-link" [routerLink]="'/subordinados'" routerLinkActive="active"
          >Subordinados</a
        >
        <a class="nav-link" [routerLink]="'/signal'" routerLinkActive="active"
          >Ejemplo de Señal: {{ _serviceSignal.contador() }}</a
        >
      </div>
      <button class="btn btn-logout ms-auto" (click)="logout()">
        @if (usuario()) {
          <span class="user-name">{{ usuario()?.apellido }}</span>
        } @else {
          <span class="user-name">Usuario no autenticado</span>
        }
        <span aria-hidden="true">↪</span>
        Cerrar sesión
      </button>
    </div>
  </nav>
}
